<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Example component</title>
    <style>
      #toolbar {
        padding: 12px;
        background: #f5f5f5;
        border-bottom: 1px solid #ddd;
        font-family: sans-serif;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #toolbar select {
        padding: 4px 8px;
        font-size: 14px;
      }
    </style>
  </head>
  <body style="margin: 0">
    <div id="toolbar">
      <label for="control-selector">Контрол:</label>
      <select id="control-selector">
        <option value="card-api-demo-card-loader">CardApiDemo</option>
        <option value="cover-api-demo-cover-loader">CoverApiDemo</option>
        <option value="performed-work-details-grid-card-loader">PerformedWorkDetailsGrid</option>
        <option value="string-control-card-loader">StringControl</option>
        <option value="gantt-cover-loader">Gantt</option>
        <option value="actions-panel-cover-loader">ActionsPanel</option>
      </select>
    </div>
    <div id="app"></div>
  </body>
</html>
